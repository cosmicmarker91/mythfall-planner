<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mythfall Skill Tree Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="viewport"><div id="world"></div></div>

  <h1 id="title">Skill Tree</h1>
  <div id="resetwrap">
    <button id="reset" class="mf-btn">Reset</button>
    <div class="free">Temporarily Free!</div>
  </div>

  <button id="charBtn" class="char-btn" title="Character" aria-label="Open character">
    <svg viewBox="0 0 10 9" shape-rendering="crispEdges" aria-hidden="true">
      <path fill="#090a13" d="M2 0h6v1H2zM1 1h1v1H1zM8 1h1v1H8zM0 2h1v7H0zM9 2h1v7H9zM2 3h6v2H2zM4 5h2v3H4zM1 8h3v1H1zM6 8h3v1H6z"/>
      <path fill="#fff" d="M2 1h6v1H2zM1 2h8v1H1zM1 3h1v2H1zM8 3h1v2H8zM1 5h3v3H1zM6 5h3v3H6z"/>
    </svg>
  </button>

  <div id="charOverlay" hidden>
    <section id="charPanel" role="dialog" aria-modal="true" aria-label="Character">
      <h2 class="c-title">Character</h2>
      <button id="charClose" class="c-x" aria-label="Close">X</button>
      <div class="c-cols">
        <div class="c-left">
          <h3 class="c-h">Equipment</h3>
          <div id="slots" class="c-slots"></div>
          <div id="pills" class="c-pills"></div>
          <h3 class="c-h">Base Stats</h3>
          <div class="c-limit"><div id="limitFill"></div><span id="limitTxt">Stat Limit: 0/100</span></div>
          <div class="c-stats" id="stats"></div>
        </div>
        <div class="c-right">
          <h3 class="c-h">Bonus Stats</h3>
          <div id="bonusList" class="c-bonuslist"></div>
        </div>
      </div>
      <div id="charTip" class="c-tip" hidden></div>
    </section>
  </div>

  <div id="pickOverlay" hidden>
    <section class="pk-panel" role="dialog" aria-modal="true" aria-label="Items">
      <h2 class="c-title" id="pickTitle">Weapon</h2>
      <button id="pickClose" class="c-x" aria-label="Close">X</button>
      <div id="pickTabs" class="pk-tabs"></div>
      <div class="pk-bar"><input id="pickSearch" placeholder="Search items" aria-label="Search items"><button id="pickClear" class="c-btn wide" hidden>Unequip</button></div>
      <div id="pickList" class="pk-list"></div>
      <div id="pickEmpty" class="pk-empty" hidden>No items found</div>
    </section>
  </div>
  <div id="itemTip" class="itemtip" hidden></div>

  <div id="buildbar">
    <input id="buildName" maxlength="40" placeholder="Name your build" aria-label="Build name">
    <button id="share" class="mf-btn sm">Copy Link</button>
    <button id="publish" class="mf-btn sm">Publish</button>
    <button id="communityBtn" class="mf-btn sm">Community</button>
    <button id="changelogBtn" class="mf-btn sm dim">Changelog<i id="clDot" hidden></i></button>
    <button id="fit" class="mf-btn sm dim" title="Re-center the view">Fit</button>
  </div>

  <div id="points" title="Skillpoints spent"><img src="assets/skill-point.png" alt=""><span id="count">0</span></div>

  <aside id="panel" aria-live="polite">
    <div class="p-head">
      <div class="p-icon"><img id="pIcon" alt=""></div>
      <div class="p-title"><div id="pName"></div><div id="pType"></div></div>
    </div>
    <div class="p-fx" id="pEffects"></div>
    <div class="p-foot">
      <div id="pCost"></div>
      <button id="pBtn" class="p-btn">Purchase</button>
      <button id="pPath" class="p-link" hidden></button>
    </div>
  </aside>
  <div id="hint">Scroll to zoom · Drag to pan · Hover for the path · Click to select · Click again (or double-click) to purchase</div>

  <dialog id="community">
    <div class="dlg-head"><h2>Community Builds</h2><button id="closeCommunity" class="mf-btn sm dim">Close</button></div>
    <div id="communityNote"></div>
    <ul id="communityList"></ul>
  </dialog>
  <dialog id="changelog">
    <div class="dlg-head"><h2>Changelog</h2><button id="closeChangelog" class="mf-btn sm dim">Close</button></div>
    <div id="changelogList"></div>
  </dialog>
  <div id="egg" hidden><video id="eggVideo" src="assets/dodge.mp4" preload="none" playsinline></video></div>
  <div id="toast"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
